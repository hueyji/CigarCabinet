<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ec" />
    <title>销售后台 - 雪茄柜报价</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="sales-shell">
      <section class="sales-card" id="loginPanel">
        <h1>销售后台</h1>
        <div class="field-card">
          <div class="field-title">
            <label for="passwordInput">访问密码</label>
            <span>请输入密码</span>
          </div>
          <div class="number-row">
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="请输入密码" />
          </div>
        </div>
        <button class="quote-button" id="loginButton" type="button">进入后台</button>
        <p class="warning-text" id="loginMessage"></p>
      </section>

      <section class="sales-dashboard is-hidden" id="dashboard">
        <header class="sales-header">
          <div>
            <h1>报价管理</h1>
          </div>
          <button class="secondary-button" id="refreshButton" type="button">刷新</button>
        </header>

        <section class="sales-card">
          <div class="section-title">
            <h2>材料单价</h2>
            <span>元/㎡</span>
          </div>
          <div class="sales-price-grid">
            <div class="field-card">
              <div class="field-title">
                <label for="veneerPriceInput">雪松木贴皮</label>
              </div>
              <div class="number-row">
                <input id="veneerPriceInput" type="number" inputmode="numeric" min="0" step="10" />
                <span>元/㎡</span>
              </div>
            </div>
            <div class="field-card">
              <div class="field-title">
                <label for="solidPriceInput">雪松木实木</label>
              </div>
              <div class="number-row">
                <input id="solidPriceInput" type="number" inputmode="numeric" min="0" step="10" />
                <span>元/㎡</span>
              </div>
            </div>
          </div>
          <button class="quote-button" id="saveSettingsButton" type="button">保存单价</button>
          <p class="warning-text" id="settingsMessage"></p>
        </section>

        <section class="sales-card">
          <div class="section-title">
            <h2>客户报价单</h2>
            <button class="danger-button" id="clearQuotesButton" type="button">一键删除所有报价单</button>
          </div>
          <div class="quote-table-wrap">
            <table class="quote-table">
              <thead>
                <tr>
                  <th>时间</th>
                  <th>手机号</th>
                  <th>布局</th>
                  <th>材料</th>
                  <th>尺寸</th>
                  <th>面积</th>
                  <th>单价</th>
                  <th>总价</th>
                </tr>
              </thead>
              <tbody id="quotesBody"></tbody>
            </table>
          </div>
          <p class="warning-text" id="quotesMessage"></p>
        </section>
      </section>
    </main>

    <script type="module" src="./sales.js"></script>
  </body>
</html>
